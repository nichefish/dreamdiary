/**
 * DreamDiary Mobile — Gradle tasks for IntelliJ (Gradle tool window > mobile).
 * Android emulator: backend on PC localhost:18081, .env EXPO_PUBLIC_API_BASE_URL=http://10.0.2.2:18081
 *
 * configuration cache(org.gradle.configuration-cache=true) 호환을 위해
 * doLast { exec {} } 대신 Exec 타입 태스크를 쓰고, 경로는 구성 단계에서 계산한다.
 */

def mobileDir = file("$projectDir/app/mobile-react-native")
def runAndroidPs1 = file("$projectDir/app/mobile-react-native/run-android.ps1")
def isWindows = org.apache.tools.ant.taskdefs.condition.Os.isFamily(org.apache.tools.ant.taskdefs.condition.Os.FAMILY_WINDOWS)

/** .gradle/nodejs/node-v* (node-gradle plugin download) */
def nodejsRoot = file("$projectDir/.gradle/nodejs")
def nodeDirs = nodejsRoot.exists()
        ? (nodejsRoot.listFiles()?.findAll { it.isDirectory() && it.name.startsWith('node-v') }?.sort { a, b -> b.name <=> a.name } ?: [])
        : []
def gradleNodeExe = nodeDirs ? new File(nodeDirs[0], isWindows ? 'node.exe' : 'bin/node') : null
def gradleNpmCli = gradleNodeExe ? new File(gradleNodeExe.parentFile, 'node_modules/npm/bin/npm-cli.js') : null
def pathHasNpm = (System.getenv('PATH') ?: '').split(File.pathSeparator).any { dir -> new File(dir, isWindows ? 'npm.cmd' : 'npm').exists() }
// Expo SDK 57 은 Node 22.13+ 가 필요하므로 PATH npm(Node 22)을 우선하고, 없을 때만 Gradle Node 를 쓴다.
def useGradleNode = !pathHasNpm && gradleNodeExe?.exists() && gradleNpmCli?.exists()

/** PATH npm 우선, 없으면 Gradle Node 로 npm 명령을 구성한다. */
def npmCommand = { List<String> npmArgs ->
    if (useGradleNode) {
        return [gradleNodeExe.absolutePath, gradleNpmCli.absolutePath] + npmArgs
    }
    return isWindows ? ['cmd', '/c', 'npm'] + npmArgs : ['npm'] + npmArgs
}

tasks.register('mobileAndroid', Exec) {
    group = 'mobile'
    description = 'Expo on Android emulator (AVD + backend :18081, .env 10.0.2.2)'
    workingDir mobileDir
    if (isWindows) {
        commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', runAndroidPs1.absolutePath
    } else {
        commandLine 'sh', '-c', 'echo "mobileAndroid: Windows only (use npm run android in app/mobile-react-native)" >&2; exit 1'
    }
}

tasks.register('mobileInstall', Exec) {
    group = 'mobile'
    description = 'npm install in app/mobile-react-native (PATH npm or Gradle Node after npmSetup)'
    workingDir mobileDir
    commandLine npmCommand(['install'])
}

tasks.register('mobileTypeCheck', Exec) {
    group = 'mobile'
    description = 'tsc --noEmit in app/mobile-react-native'
    dependsOn 'mobileInstall'
    workingDir mobileDir
    commandLine npmCommand(['run', 'type-check'])
}